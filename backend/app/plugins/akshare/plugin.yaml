# AKShare 免费数据源插件 (https://akshare.akfamily.xyz)
# 上游: 新浪财经 (日K/分钟/实时/财务三表/关键指标)、巨潮资讯 (历史股本)、沪深京交易所官网 (代码表)。
# 东财系接口 (stock_zh_a_hist / _hist_min_em / _spot_em) 在部分网络被阻断, 本插件不依赖。
# runtime: python, 需 pip install akshare (可在设置页点「安装」)。

name: akshare
display_name: "AKShare"
runtime: python
entry: app.plugins.akshare.provider:AkShareProvider
check: app.plugins.akshare.provider:availability
datasets: [daily, adj_factor, minute, realtime, financial]
hidden: false
description: "AKShare 免费开源数据源(新浪/巨潮/交易所官网)。日K(全历史)/除权因子(比值法推导)/分钟K(近8交易日)/实时全市场(5550只)/财务三表与关键指标(1998至今)/历史股本(含真实公告日)。请求带指数退避重试与间隔限流。"
install_hint: "安装依赖: pip install akshare(可在设置页点「安装」, 或 cd backend/app/plugins/akshare && uv pip install -r requirements.txt)"
